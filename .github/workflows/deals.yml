name: Amazon EG Deals

on:
  schedule:
    - cron: "0 */3 * * *"   # كل 3 ساعات
  workflow_dispatch:         # زرار تشغيل يدوي

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python amazon_eg_deals.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add deals_state.json
          git diff --cached --quiet || git commit -m "update deals state"
          git push
