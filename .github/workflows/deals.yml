name: Amazon EG Deals

on:
  schedule:
    - cron: "0 */3 * * *"   # احتياطي بس: البوت مبيكلمش أمازون لو الـ Worker cron دقّ في آخر 4 ساعات
  workflow_dispatch:         # زرار تشغيل يدوي
    inputs:
      selftest:
        description: "تجربة تليجرام بس (القناة + صورة وزراير للخاص) من غير بحث"
        type: boolean
        default: false
      announce:
        description: "ملف رسالة (زي messages/welcome.html) يتنشر في القناة ويتثبت من غير بحث"
        type: string
        default: ""
      announce_edit:
        description: "رقم رسالة في القناة تتعدّل مكانها بالملف ده (بدل بوست جديد)"
        type: string
        default: ""
      trigger:
        description: "مين شغّل التشغيلة: cron (الـ Worker في ميعاده) أو manual"
        type: string
        default: "manual"

permissions:
  contents: write

# تشغيلتين مع بعض ممكن يكتبوا فوق حالة بعض، فبنخليهم ورا بعض
concurrency:
  group: deals
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # لو التشغيلة كانت مستنية ورا تشغيلة تانية (concurrency)، الـ checkout بيجيب commit قديم:
      # بنجيب آخر حالة عشان قاعدة "مفيش تشغيلتين كاملين في ساعتين" تشتغل صح
      - name: Get latest state
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 curl_cffi tzdata
      - run: python amazon_eg_deals.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
          SELFTEST: ${{ inputs.selftest }}
          ANNOUNCE: ${{ inputs.announce }}
          ANNOUNCE_EDIT: ${{ inputs.announce_edit }}
          BOT_TRIGGER: ${{ inputs.trigger }}
      - name: Save state
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add deals_state.json
          if [ -d data ]; then git add data/; fi
          if [ -f docs/deals.json ]; then git add docs/deals.json docs/history.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "update deals state"
          # الـ Worker (المرحلة 3) بيعمل commits هو كمان، فبنعمل rebase قبل الـ push ونعيد لو فشل
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
