# Cloudflare Worker: تليجرام webhook + Cron بيشغّل البوت في ميعاده
# الأسرار (wrangler secret put): TG_TOKEN، OWNER_CHAT_ID، GITHUB_TOKEN، TG_WEBHOOK_SECRET
name = "loata-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
GITHUB_REPO = "Maged-Mohammed/amazon-deals"
WORKFLOW_FILE = "deals.yml"
DASHBOARD_URL = "https://maged-mohammed.github.io/amazon-deals/"

[triggers]
# الـ Cron بتوقيت UTC:
#  - كل 3 ساعات (زي GitHub schedule اللي فاضل كاحتياطي)
#  - 05:05 و 06:05 UTC: واحد فيهم بيبقى 08:05 القاهرة (صيفي +3 / شتوي +2)، والكود بيشغّل اللي الساعة فيه 8 بس
crons = ["0 */3 * * *", "5 5 * * *", "5 6 * * *"]

[observability]
enabled = true
