# Cloudflare Worker: تليجرام webhook + Cron بيشغّل البوت في ميعاده
# الأسرار (wrangler secret put): TG_TOKEN، OWNER_CHAT_ID، GITHUB_TOKEN، TG_WEBHOOK_SECRET
name = "loata-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
GITHUB_REPO = "Maged-Mohammed/amazon-deals"
WORKFLOW_FILE = "deals.yml"
DASHBOARD_URL = "https://maged-mohammed.github.io/amazon-deals/"
TG_CHANNEL_ID = "@loata_amazon"   # عشان 🗑️ احذف من القناة
BOT_USERNAME = "loatamazonbot"

# بيانات اللي بيبلّغوا (Telegram ID + عدادات) هنا بس، مش في الريبو العام، وبتتمسح لوحدها بعد 8 أيام
[[kv_namespaces]]
binding = "REPORTS_KV"
id = "1db786c4d79a48d3be034c6bd9e7bc3f"

# البيانات الشخصية (المتابعة، المكتوم، البلاغات وقراراتك): D1 خاص، مش في الريبو العام
[[d1_databases]]
binding = "DB"
database_name = "loata-private"
database_id = "c1a4a649-811a-4481-a0e3-9011ebe506e2"

[triggers]
# الـ Cron بتوقيت UTC:
#  - كل 3 ساعات (زي GitHub schedule اللي فاضل كاحتياطي)
#  - 05:05 و 06:05 UTC: واحد فيهم بيبقى 08:05 القاهرة (صيفي +3 / شتوي +2)، والكود بيشغّل اللي الساعة فيه 8 بس
#  - 01:20 UTC: نسخة احتياطية يومية من D1 لـ KV (خاص، 35 يوم)
crons = ["0 */3 * * *", "5 5 * * *", "5 6 * * *", "20 1 * * *"]

[observability]
enabled = true
